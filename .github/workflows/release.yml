name: release

# Cut a GitHub Release whenever a semver tag is pushed. This turns the engine's
# `branch=main` consumption into tagged releases, so consumers can pin a version
# (`tag = "vX.Y.Z"`) instead of a moving branch — the foundation of keeping the
# three repos decoupled but reproducibly in sync. Release notes are auto-generated
# from the merged PRs since the previous tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --verify-tag
