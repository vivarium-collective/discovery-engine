[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discovery-engine"
version = "0.1.0"
description = "A derive-first scientific-investigation discovery cycle engine for the Vivarium ecosystem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vivarium Collective" }]
keywords = ["scientific-investigation", "discovery", "process-bigraph", "vivarium"]
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "click>=8.1",
    "numpy>=1.24",
    "polars>=0.20",
    # reads run results (RunReader / by_generation) — the engine's evidence source
    "viva-emitters[parquet]>=0.2.3",
    # resolves a workspace's package/layout
    "viva-workspace",
    # composite spec / generator registry (composite_spec, core_introspection)
    "process-bigraph",
    "bigraph-schema",
    "filelock>=3.12",
    "jinja2>=3.1",
    "jsonschema[format-nongpl]>=4.21",
    "psutil>=5.9",
    "rich>=13.0",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "import-linter>=2.0"]

[project.scripts]
# the investigation discovery-cycle CLI (was `viva-discover`)
discover = "discovery_engine.discover:main"

[project.urls]
Homepage = "https://github.com/vivarium-collective/discovery-engine"
Repository = "https://github.com/vivarium-collective/discovery-engine"

[tool.uv.sources]
viva-workspace = { git = "https://github.com/vivarium-collective/viva-workspace.git", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["discovery_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", "tests/_fixtures", ".*", "build", "dist"]

# Lock the seam: discovery-engine is the single source of truth and must never
# import its own consumers. This makes the "decoupled" direction a CI-enforced
# invariant (no circular edge back to the skills facade or the UI) rather than a
# property that merely happens to hold today. Run with `lint-imports`.
[tool.importlinter]
root_package = "discovery_engine"
# the consumers below are external packages (not subpackages of discovery_engine)
include_external_packages = true

[[tool.importlinter.contracts]]
name = "discovery-engine never imports its consumers"
type = "forbidden"
source_modules = ["discovery_engine"]
forbidden_modules = ["viva_superpowers", "vivarium_workbench"]

[tool.hatch.build.targets.wheel.force-include]
# scaffold/report resource templates (resource_dir("templates") -> _templates in the wheel)
"templates" = "discovery_engine/_templates"
