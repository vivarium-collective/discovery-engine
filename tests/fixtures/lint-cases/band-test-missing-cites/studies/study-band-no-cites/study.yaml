name: study-band-no-cites
baseline:
  - name: b1
    composite: pkg.composites.x
# behavior_tests[] with numeric bands but NO cites — should trigger band_test_missing_cites warning
behavior_tests:
  - name: dnaa-atp-fraction-in-band
    classification: primary
    measure:
      kind: generation_average
      path: bulk MONOMER0-160[c]
    pass_if:
      op: generation_average_in_range
      low: 0.2
      high: 0.5
    # no cites — should warn

  - name: total-dnaa-in-band
    classification: secondary
    measure:
      kind: generation_average
      path: bulk PD03831[c]
    pass_if:
      op: generation_average_in_range
      low: 300
      high: 800
    # no cites — should warn

  - name: mass-doubling
    classification: primary
    measure:
      kind: per_generation_mass_ratio
      path: listeners.mass.cell_mass
    pass_if:
      op: periodic_doubling_every_generation
      tolerance: 0.15
    # no numeric low/high/threshold — no warning expected

# tests[] (v4 per-test array shape) with numeric bands but NO cites
tests:
  - name: v4-fraction-test
    classification: primary
    measure:
      kind: generation_average
      path: MONOMER0-160[c] / (PD03831[c] + MONOMER0-160[c] + MONOMER0-4565[c])
    pass_if:
      op: generation_average_in_range
      low: 0.2
      high: 0.5
    status: passed
    # no cites — should warn

  - name: charge-conservation-pin
    classification: diagnostic
    gate_class: regression_pin
    measure:
      kind: generation_average
      path: listeners.charge.imbalance
    pass_if:
      op: generation_average_in_range
      low: 0.0
      high: 0.000001
    # numeric band BUT a regression_pin (a conservation pin, set after the run) —
    # has no external prior to cite, so NO band_test_missing_cites warning.
