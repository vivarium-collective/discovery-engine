name: legacy-readouts
baseline:
  - name: b1
    composite: pkg.composites.x
readouts:
  # already canonical — dry-run migrate leaves it byte-identical
  - name: DnaA monomer total
    index_by:
      type: literal_index
      value: 3861
    store_path: listeners.monomer_counts
    units: molecules/cell
    status: primary
  # clean legacy identifier dialect — resolvable, canonical form DIFFERS → migratable
