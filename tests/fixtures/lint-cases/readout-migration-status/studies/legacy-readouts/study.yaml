    status: primary
    identifier: listeners.mass.cell_mass[2]
    units: fg
  # prose ·-group — unresolvable → needs_human
  - name: DnaA-form counts
    status: measured
    identifier: "bulk PD03831[c] (apo) · MONOMER0-160[c] (DnaA-ATP)"
    units: molecules/cell
